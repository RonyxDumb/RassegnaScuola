plugins { id 'com.android.application' }
def releaseInfo = new Properties()
rootProject.file('app-version.properties').withInputStream { releaseInfo.load(it) }
android {
    namespace 'com.ronyxdumb.rassegnascuola'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.ronyxdumb.rassegnascuola'
        minSdk 29
        targetSdk 35
        versionCode releaseInfo.versionCode.toInteger()
        versionName releaseInfo.versionName
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('RS_KEYSTORE')) {
                storeFile file(System.getenv('RS_KEYSTORE'))
                storePassword System.getenv('RS_STORE_PASSWORD')
                keyAlias System.getenv('RS_KEY_ALIAS')
                keyPassword System.getenv('RS_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('RS_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies { implementation project(':shared') }
