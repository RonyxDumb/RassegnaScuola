name: Android and Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :shared:verifyCore :android:app:assembleDebug :android:app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Load release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY" || { echo 'Configure ANDROID_KEYSTORE_BASE64 before publishing a release'; exit 1; }
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RS_KEYSTORE: ${{ runner.temp }}/release.jks
          RS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/^versionName=//p' app-version.properties)
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Tag and versionName differ'; exit 1; }
          ./gradlew :android:app:assembleRelease --no-daemon
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/RassegnaScuola-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Android-release
          path: release/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :shared:verifyCore --no-daemon
      - run: .\scripts\build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: output/*windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64
          path: release
      - name: Publish both targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Rassegna Scuola $GITHUB_REF_NAME" --generate-notes
