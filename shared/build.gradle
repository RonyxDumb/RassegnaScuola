plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies { api 'com.google.code.gson:gson:2.11.0' }
sourceSets.main.resources.setSrcDirs([])
processResources { from(rootProject.file('app-version.properties')) { rename { 'app.properties' } } }
tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ronyxdumb.rassegnascuola.CoreChecks'
}
tasks.named('check') { dependsOn verifyCore }
